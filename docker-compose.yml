services:
  mysql:
    image: mysql:8.0
    container_name: risklens-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: risklens_pass
      MYSQL_DATABASE: risklens
    ports:
      - "3306:3306"
    volumes:
      - risklens_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  risklens_mysql_data:
